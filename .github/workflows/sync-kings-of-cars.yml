name: Sync King of Cars inventory and build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync full live King of Cars inventory
        env:
          SUPABASE_URL: ${{ secrets.KINGS_OF_CARS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KINGS_OF_CARS_SUPABASE_SERVICE_ROLE_KEY }}
          KINGS_OF_CARS_DEALER_ID: 13400
          KINGS_OF_CARS_PAGE_SIZE: 500
          KINGS_OF_CARS_MIN_EXPECTED: 250
        run: pnpm sync:inventory

      - name: Build application with synced inventory
        run: pnpm build
