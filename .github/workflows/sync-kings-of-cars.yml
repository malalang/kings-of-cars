name: Sync King of Cars inventory

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  sync-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Import live King of Cars inventory in batches
        env:
          SUPABASE_URL: ${{ secrets.KINGS_OF_CARS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KINGS_OF_CARS_SUPABASE_SERVICE_ROLE_KEY }}
          KINGS_OF_CARS_MAX_PAGES: 40
          KINGS_OF_CARS_BATCH_SIZE: 20
          KINGS_OF_CARS_DETAIL_CONCURRENCY: 3
        run: |
          set -u
          for offset in $(seq 0 20 380); do
            echo "===== King of Cars batch offset ${offset} ====="
            KINGS_OF_CARS_BATCH_OFFSET=${offset} pnpm exec node scripts/import-kingofcars-batch.mjs || {
              echo "Batch ${offset} failed; continuing with the next batch."
            }
          done
