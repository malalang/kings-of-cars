name: Fix Cars Server Component CSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cars): remove styled-jsx from server page') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace styled-jsx with plain style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/client/app/cars/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<style jsx global>'
          new = '<style>'
          if old not in text:
              raise SystemExit("Expected '<style jsx global>' was not found in apps/client/app/cars/page.tsx")
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- apps/client/app/cars/page.tsx; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client/app/cars/page.tsx
          git commit -m "fix(cars): remove styled-jsx from server page"
          git push
